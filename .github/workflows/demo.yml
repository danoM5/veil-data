name: Publish waitlist

# Republishes the waitlist page without rebuilding the map data:
# it reuses the site from the last successful map refresh, adds waitlist/, and deploys.
on:
  workflow_dispatch:
  workflow_run:              # after each map refresh, put the newest waitlist back on top
    workflows: [Refresh map data]
    types: [completed]
  push:
    branches: [main]
    paths: [waitlist/**, .github/workflows/demo.yml]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages-demo
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Fetch the current map site from the last refresh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run=$(gh run list -R "$GITHUB_REPOSITORY" --workflow refresh.yml --status success -L 1 --json databaseId -q '.[0].databaseId')
          echo "Using refresh run $run"
          gh run download "$run" -R "$GITHUB_REPOSITORY" -n github-pages -D prev
          mkdir -p site && tar -xf prev/artifact.tar -C site
          test -f site/index.json || { echo "::error::The last refresh's site has expired. Run 'Refresh map data' once."; exit 1; }
          rm -rf site/demo site/v
          if [ -d waitlist ]; then rm -rf site/waitlist && cp -r waitlist site/waitlist; fi
          echo "::notice::Waitlist updated"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
